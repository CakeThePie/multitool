<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Access</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .login-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #message { color: red; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Enter Password</h2>
        <input type="password" id="passInput" placeholder="Password">
        <br>
        <button onclick="checkPassword()">Login</button>
        <div id="message"></div>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            const message = document.getElementById('message');
            
            // The password check
            if (pass === "6981") {
                window.location.href = "home.html";
            } else {
                message.innerText = "Incorrect password. Try again.";
            }
        }

        // Allow pressing "Enter" key to login
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { checkPassword(); }
        });
    </script>
</body>
</html>
