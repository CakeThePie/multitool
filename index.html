<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Khai báo Font đúng tên file .otf */
        @font-face {
            font-family: 'TalinaDemo';
            src: url('Talina DEMO.otf') format('opentype'); 
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff; /* Nền trắng */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* Tiểu đề trên giữa màn hình - Đúng định dạng chữ */
        .top-title {
            position: absolute;
            top: 20%;
            font-size: 1.88rem;
            color: #333;
            text-align: center;
        }

        /* Box Password - Xóa hoàn toàn các hiệu ứng dao động (animation) */
        .login-box {
            z-index: 2;
            ; /* Chỉ giữ lại hiệu ứng phóng to khi hover */
        }

        .login-box:hover {
            ; 
        }

        input[type="password"] {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: 2px solid #000000; /* Viền đen */
            background-color: #ffffff;
            border-radius: 8px;
            outline: none;
            text-align: center;
            /* Hiệu ứng Neon Trắng */
            box-shadow: 0 0 10px #ffffff, 0 0 20px #eeeeee;
        }

        /* Nút Enter tối giản */
        .btn-enter {
            margin-top: 20px;
            display: block;
            width: 100%;
            padding: 12px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Chữ ở góc phải phía dưới - Font Talina DEMO và kích thước tầm trung */
        .footer-credit {
            position: absolute;
            bottom: 30px;
            right: 40px;
            font-size: 0.66rem; 
            color: #333; 
            font-family: 'TalinaDemo', sans-serif;
        }

        #error-msg {
            color: black;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="top-title">Welcome to The Site</div>

    <div class="login-box">
        <input type="password" id="passInput" placeholder="Password">
        <div id="error-msg"></div>
        <button class="btn-enter" onclick="checkPassword()">LOGIN</button>
    </div>

    <div class="footer-credit">Created by H.P.H - Max</div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('passInput').value;
            const error = document.getElementById('error-msg');
            
            if (pass === "6981") {
                window.location.href = "menu001.html";
            } else {
                error.innerText = "Access Denied!";
            }
        }

        // Hỗ trợ nhấn phím Enter để đăng nhập
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { 
                checkPassword(); 
            }
        });
    </script>
</body>
</html>
